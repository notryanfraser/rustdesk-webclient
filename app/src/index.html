<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: iOS draws the page under the status bar / home indicator anyway (as an
         installed app, and in Safari 26); styles.css keeps controls clear with env(safe-area-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>Ferry</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- PWA: installable; iOS ignores the manifest's icons and wants a PNG touch icon. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="theme-color" content="#1f2328" />
    <link rel="stylesheet" href="styles.css" />
    <!-- Server settings (ID server, key): written by the container at start-up. Deferred scripts
         run in document order, so it still runs before app.js without blocking the first paint. -->
    <script defer src="config.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Ferry needs JavaScript.</noscript>
  </body>
</html>
