# Publishes the image to GitHub's container registry when a version tag (v1.2.3) is pushed:
#   ghcr.io/<owner>/<repo>:1.2.3, :1.2, :1 and :latest, for amd64, arm64 and arm/v7.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        # The Dockerfile's final stage only copies files, so no emulation is needed for the
        # other platforms; the JS build runs once, natively.
        run: |
          set -eu
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          V="${GITHUB_REF_NAME#v}"
          docker buildx create --use --name release >/dev/null
          docker buildx build --push \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${V}" \
            -t "${IMAGE}:${V}" -t "${IMAGE}:${V%.*}" -t "${IMAGE}:${V%%.*}" -t "${IMAGE}:latest" \
            -f docker/Dockerfile .
