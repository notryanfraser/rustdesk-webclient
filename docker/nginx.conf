# Static server for the Ferry app, served at /rustdesk/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # CSP: everything from this origin (the video worker and the audio worklet are files: no
    # blob: scripts); WebSockets go to hbbs and to whichever relay hbbs names, so any wss: host
    # (ws: is never used over https). No inline script or style, no eval, no framing, no data:
    # or blob: anything.
    set $csp "default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self' wss:; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; manifest-src 'self'";

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy $csp always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        return 301 /rustdesk/;
    }

    # Browsers ask for /favicon.ico regardless of the page's <link rel="icon">.
    location = /favicon.ico {
        alias /usr/share/nginx/html/rustdesk/favicon.svg;
        default_type image/svg+xml;
    }

    # Written at container start by 10-app-config.sh from RUSTDESK_ID_SERVER / RUSTDESK_KEY.
    location = /rustdesk/config.js {
        alias /run/rustdesk-web/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $csp always;
    }

    # The stock mime.types has no .webmanifest; without this it is served as octet-stream.
    location = /rustdesk/manifest.webmanifest {
        default_type application/manifest+json;
    }

    location /rustdesk/ {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
